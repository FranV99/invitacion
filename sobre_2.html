<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sobre animado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
<style>
  :root {
    --w: min(340px, 80vw);          /* ancho del sobre */
    --h: calc(var(--w) * 0.62);     /* alto del sobre */
    --sobre: #fbfaf7;
    --sobre-oscuro: #efece6;
    --sobre-claro: #ffffff;
    --interior: #dcd7ce;
    --t-solapa: .6s;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #f3efe8;
    font-family: system-ui, sans-serif;
    overflow-x: hidden;
  }

  .escena {
    padding-top: calc(var(--h) * 0.9); /* espacio para que la carta suba */
  }

  .sobre {
    position: relative;
    width: var(--w);
    height: var(--h);
    perspective: 900px;
    cursor: pointer;
    outline: none;
  }
  .sobre:focus-visible { box-shadow: 0 0 0 3px #3a7bd5; border-radius: 4px; }

  /* Parte trasera (interior visible cuando se abre) */
  .trasera {
    position: absolute; inset: 0;
    background: var(--interior);
    border-radius: 4px;
    z-index: 1;
    box-shadow: 0 10px 25px rgba(0,0,0,.18);
  }

  /* Carta con la invitación */
  .carta {
    position: absolute;
    left: 5%; bottom: 4%;
    width: 90%; height: 92%;
    background: #fff;
    border-radius: 6px;
    z-index: 2;
    overflow: hidden;
    box-shadow: 0 2px 6px rgba(0,0,0,.15);
  }
  .carta img {
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: top center;
    display: block;
    user-select: none;
    -webkit-user-drag: none;
  }

  /* Cuando la carta sale del sobre y se muestra en grande */
  .carta.suelta {
    position: fixed;
    bottom: auto;
    z-index: 100;
    border-radius: 10px;
    box-shadow: 0 25px 60px rgba(0,0,0,.35);
    cursor: zoom-out;
  }

  .velo {
    position: fixed; inset: 0;
    background: rgba(45, 40, 32, .45);
    opacity: 0;
    pointer-events: none;
    transition: opacity .5s ease;
    z-index: 90;
  }
  .velo.visible { opacity: 1; pointer-events: auto; cursor: zoom-out; }

  /* Bolsillo frontal (la "V" de abajo) */
  .frontal {
    position: absolute; inset: 0;
    z-index: 3;
    pointer-events: none;
    background:
      linear-gradient(to top right, var(--sobre-oscuro) 50%, transparent 50.5%) left bottom / 50.5% 100% no-repeat,
      linear-gradient(to top left,  var(--sobre-oscuro) 50%, transparent 50.5%) right bottom / 50.5% 100% no-repeat,
      var(--sobre);
    clip-path: polygon(0 0, 50% 55%, 100% 0, 100% 100%, 0 100%);
    border-radius: 0 0 4px 4px;
  }

  /* Solapa superior */
  .solapa {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 58%;
    transform-origin: top center;
    z-index: 4;
    /* Sombra suave para que la solapa blanca se distinga del frontal */
    filter: drop-shadow(0 2px 2px rgba(0,0,0,.12));
    transition:
      transform var(--t-solapa) ease-in-out,
      z-index 0s linear calc(var(--t-solapa) / 2);
  }
  .solapa-forma {
    width: 100%; height: 100%;
    background: linear-gradient(to bottom, var(--sobre-claro), var(--sobre));
    clip-path: polygon(0 0, 100% 0, 50% 100%);
  }
  .sobre.abierto .solapa {
    transform: rotateX(180deg);
    z-index: 1;
  }

  /* ===== Agitado cuando está cerrado (cada 2 s) ===== */
  .sobre:not(.abierto):not(.ocupado) {
    transform-origin: 50% 100%;
    animation: agitar 2s ease-in-out .5s infinite;
  }

  @keyframes agitar {
    0%, 55%, 100% { transform: none; }
    60% { transform: translateY(-14px) rotate(-9deg); }
    66% { transform: translateY(-10px) rotate(9deg); }
    72% { transform: translateY(-6px) rotate(-7deg); }
    78% { transform: translateY(-3px) rotate(5deg); }
    84% { transform: rotate(-3deg); }
    90% { transform: rotate(1deg); }
  }

  .ayuda {
    margin-top: 24px;
    text-align: center;
    color: #6b6258;
    font-family: 'Great Vibes', 'Brush Script MT', cursive;
    font-size: 34px;
    transition: opacity .4s;
  }
  .sobre.abierto ~ .ayuda { opacity: 0; }
</style>
</head>

    <div class="frontal" id="frontal"></div>
    <div class="solapa"><div class="solapa-forma"></div></div>
  </div>
  <div class="ayuda">Pulsa el sobre</div>
</div>

<div class="velo" id="velo"></div>

<script>
  const sobre = document.getElementById('sobre');
  const carta = document.getElementById('carta');
  const frontal = document.getElementById('frontal');
  const velo = document.getElementById('velo');
  const img = carta.querySelector('img');

  const T_SOLAPA = 600;   // debe coincidir con --t-solapa
  const T_SUBIR = 700;    // la carta sale del sobre
  const T_AMPLIAR = 700;  // la carta pasa a verse en grande
  const CURVA = 'cubic-bezier(.5,0,.3,1)';

  let ocupado = false;
  let abierto = false;

  const esperar = ms => new Promise(r => setTimeout(r, ms));

  // Posición de la carta justo por encima del sobre (al terminar de salir)
  function rectFuera() {
    const s = sobre.getBoundingClientRect();
    const w = s.width * 0.9, h = s.height * 0.92;
    return {
      left: s.left + s.width * 0.05,
      top: s.top + s.height * 0.04 - h * 1.05,
      width: w, height: h
    };
  }

  // Tamaño final: la invitación completa, centrada y respetando su proporción
  function rectGrande() {
    const prop = (img.naturalHeight / img.naturalWidth) || (16 / 9);
    let h = Math.min(innerHeight * 0.92, innerWidth * 0.92 * prop);
    const w = h / prop;
    return { left: (innerWidth - w) / 2, top: (innerHeight - h) / 2, width: w, height: h };
  }

  const aKf = r => ({ left: r.left + 'px', top: r.top + 'px', width: r.width + 'px', height: r.height + 'px' });
  function aplicar(r) { Object.assign(carta.style, aKf(r)); }

  async function abrir() {
    ocupado = true;
    sobre.classList.add('ocupado', 'abierto');
    sobre.setAttribute('aria-expanded', 'true');
    await esperar(T_SOLAPA);

    await carta.animate(
      [{ transform: 'translateY(0)' }, { transform: 'translateY(-105%)' }],
      { duration: T_SUBIR, easing: CURVA }
    ).finished;

    // Sacamos la carta del sobre para poder mostrarla a pantalla completa
    const desde = rectFuera();
    const hasta = rectGrande();
    document.body.appendChild(carta);
    carta.classList.add('suelta');
    aplicar(hasta);
    velo.classList.add('visible');
    await carta.animate([aKf(desde), aKf(hasta)], { duration: T_AMPLIAR, easing: CURVA }).finished;

    abierto = true;
    ocupado = false;
  }

  async function cerrar() {
    ocupado = true;
    velo.classList.remove('visible');

    const desde = rectGrande();
    const hasta = rectFuera();
    aplicar(hasta);
    await carta.animate([aKf(desde), aKf(hasta)], { duration: T_AMPLIAR, easing: CURVA }).finished;

    // Devolvemos la carta al sobre y la guardamos
    carta.classList.remove('suelta');
    carta.removeAttribute('style');
    sobre.insertBefore(carta, frontal);
    await carta.animate(
      [{ transform: 'translateY(-105%)' }, { transform: 'translateY(0)' }],
      { duration: T_SUBIR, easing: CURVA }
    ).finished;

    sobre.classList.remove('abierto');
    sobre.setAttribute('aria-expanded', 'false');
    await esperar(T_SOLAPA);
    sobre.classList.remove('ocupado');

    abierto = false;
    ocupado = false;
  }

  function alternar(e) {
    if (e) e.stopPropagation();
    if (ocupado) return;
    abierto ? cerrar() : abrir();
  }

  sobre.addEventListener('click', alternar);
  carta.addEventListener('click', alternar);
  velo.addEventListener('click', alternar);
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && abierto) alternar();
    if ((e.key === 'Enter' || e.key === ' ') && document.activeElement === sobre) {
      e.preventDefault(); alternar();
    }
  });

  // Si cambia el tamaño de la ventana con la invitación abierta, se recoloca
  addEventListener('resize', () => { if (abierto && !ocupado) aplicar(rectGrande()); });
</script>
</body>
